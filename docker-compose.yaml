services:
  frontend:
    image: 'ghcr.io/gitroomhq/postiz-app:latest'
    container_name: postiz-frontend
    restart: always
    environment:
      # Core URLs
      MAIN_URL: 'https://postiz.keith-antony.com'
      FRONTEND_URL: 'https://postiz.keith-antony.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://postiz.keith-antony.com/api'
      BACKEND_INTERNAL_URL: 'http://backend:3000'
      
      # Security
      JWT_SECRET: '${SERVICE_PASSWORD_JWTSECRET}'
      
      # Database & Cache
      DATABASE_URL: 'postgresql://postiz-user:${SERVICE_PASSWORD_POSTGRESQL}@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'
      
      # Storage
      STORAGE_PROVIDER: '${STORAGE_PROVIDER:-local}'
      UPLOAD_DIRECTORY: '${UPLOAD_DIRECTORY:-/uploads}'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '${NEXT_PUBLIC_UPLOAD_DIRECTORY:-/uploads}'
      NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: '${NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY}'
      
      # Cloudflare R2 Storage (optional)
      CLOUDFLARE_ACCOUNT_ID: '${CLOUDFLARE_ACCOUNT_ID}'
      CLOUDFLARE_ACCESS_KEY: '${CLOUDFLARE_ACCESS_KEY}'
      CLOUDFLARE_SECRET_ACCESS_KEY: '${CLOUDFLARE_SECRET_ACCESS_KEY}'
      CLOUDFLARE_BUCKETNAME: '${CLOUDFLARE_BUCKETNAME}'
      CLOUDFLARE_BUCKET_URL: '${CLOUDFLARE_BUCKET_URL}'
      CLOUDFLARE_REGION: '${CLOUDFLARE_REGION}'
      
      # General settings
      IS_GENERAL: 'true'
      NX_ADD_PLUGINS: '${NX_ADD_PLUGINS:-false}'
      NOT_SECURED: '${NOT_SECURED:-false}'
      
    volumes:
      - 'postiz-config:/config/'
      - 'postiz-uploads:/uploads/'
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.postiz.rule=Host(`postiz.keith-antony.com`) && !PathPrefix(`/api`)
      - traefik.http.routers.postiz.entryPoints=https
      - traefik.http.routers.postiz.tls=true
      - traefik.http.routers.postiz.tls.certresolver=letsencrypt
      - traefik.http.services.postiz.loadbalancer.server.port=4200
    depends_on:
      backend:
        condition: service_started
      orchestrator:
        condition: service_started
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  backend:
    image: 'ghcr.io/gitroomhq/postiz-app:latest'
    container_name: postiz-backend
    restart: always
    environment:
      # Core URLs
      MAIN_URL: 'https://postiz.keith-antony.com'
      FRONTEND_URL: 'https://postiz.keith-antony.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://postiz.keith-antony.com/api'
      
      # Security
      JWT_SECRET: '${SERVICE_PASSWORD_JWTSECRET}'
      
      # Database & Cache
      DATABASE_URL: 'postgresql://postiz-user:${SERVICE_PASSWORD_POSTGRESQL}@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'
      
      # Temporal
      TEMPORAL_ADDRESS: 'temporal:7233'
      
      # Storage
      STORAGE_PROVIDER: '${STORAGE_PROVIDER:-local}'
      UPLOAD_DIRECTORY: '${UPLOAD_DIRECTORY:-/uploads}'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '${NEXT_PUBLIC_UPLOAD_DIRECTORY:-/uploads}'
      NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: '${NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY}'
      
      # Cloudflare R2 Storage (optional)
      CLOUDFLARE_ACCOUNT_ID: '${CLOUDFLARE_ACCOUNT_ID}'
      CLOUDFLARE_ACCESS_KEY: '${CLOUDFLARE_ACCESS_KEY}'
      CLOUDFLARE_SECRET_ACCESS_KEY: '${CLOUDFLARE_SECRET_ACCESS_KEY}'
      CLOUDFLARE_BUCKETNAME: '${CLOUDFLARE_BUCKETNAME}'
      CLOUDFLARE_BUCKET_URL: '${CLOUDFLARE_BUCKET_URL}'
      CLOUDFLARE_REGION: '${CLOUDFLARE_REGION}'
      
      # Email
      RESEND_API_KEY: '${RESEND_API_KEY}'
      EMAIL_FROM_ADDRESS: '${EMAIL_FROM_ADDRESS}'
      EMAIL_FROM_NAME: '${EMAIL_FROM_NAME}'
      EMAIL_PROVIDER: '${EMAIL_PROVIDER}'
      
      # Social Media - X (Twitter)
      X_API_KEY: '${SERVICE_X_API}'
      X_API_SECRET: '${SERVICE_X_SECRET}'
      
      # Social Media - LinkedIn
      LINKEDIN_CLIENT_ID: '${SERVICE_LINKEDIN_ID}'
      LINKEDIN_CLIENT_SECRET: '${SERVICE_LINKEDIN_SECRET}'
      
      # Social Media - Reddit
      REDDIT_CLIENT_ID: '${SERVICE_REDDIT_API}'
      REDDIT_CLIENT_SECRET: '${SERVICE_REDDIT_SECRET}'
      
      # Social Media - GitHub
      GITHUB_CLIENT_ID: '${SERVICE_GITHUB_ID}'
      GITHUB_CLIENT_SECRET: '${SERVICE_GITHUB_SECRET}'
      
      # Social Media - Threads
      THREADS_APP_ID: '${SERVICE_THREADS_ID}'
      THREADS_APP_SECRET: '${SERVICE_THREADS_SECRET}'
      
      # Social Media - Facebook
      FACEBOOK_APP_ID: '${SERVICE_FACEBOOK_ID}'
      FACEBOOK_APP_SECRET: '${SERVICE_FACEBOOK_SECRET}'
      
      # Social Media - YouTube
      YOUTUBE_CLIENT_ID: '${SERVICE_YOUTUBE_ID}'
      YOUTUBE_CLIENT_SECRET: '${SERVICE_YOUTUBE_SECRET}'
      
      # Social Media - TikTok
      TIKTOK_CLIENT_ID: '${SERVICE_TIKTOK_ID}'
      TIKTOK_CLIENT_SECRET: '${SERVICE_TIKTOK_SECRET}'
      
      # Social Media - Pinterest
      PINTEREST_CLIENT_ID: '${SERVICE_PINTEREST_ID}'
      PINTEREST_CLIENT_SECRET: '${SERVICE_PINTEREST_SECRET}'
      
      # Social Media - Dribbble
      DRIBBBLE_CLIENT_ID: '${SERVICE_DRIBBLE_ID}'
      DRIBBBLE_CLIENT_SECRET: '${SERVICE_DRIBBLE_SECRET}'
      
      # Social Media - Discord
      DISCORD_CLIENT_ID: '${SERVICE_DISCORD_ID}'
      DISCORD_CLIENT_SECRET: '${SERVICE_DISCORD_SECRET}'
      DISCORD_BOT_TOKEN_ID: '${SERVICE_DISCORD_TOKEN}'
      
      # Social Media - Slack
      SLACK_ID: '${SERVICE_SLACK_ID}'
      SLACK_SECRET: '${SERVICE_SLACK_SECRET}'
      SLACK_SIGNING_SECRET: '${SLACK_SIGNING_SECRET}'
      
      # Social Media - Mastodon
      MASTODON_CLIENT_ID: '${SERVICE_MASTODON_ID}'
      MASTODON_CLIENT_SECRET: '${SERVICE_MASTODON_SECRET}'
      
      # Social Media - Instagram
      INSTAGRAM_APP_ID: '${INSTAGRAM_APP_ID}'
      INSTAGRAM_APP_SECRET: '${INSTAGRAM_APP_SECRET}'
      
      # Beehiiv Newsletter
      BEEHIIVE_API_KEY: '${SERVICE_BEEHIIVE_KEY}'
      BEEHIIVE_PUBLICATION_ID: '${SERVICE_BEEHIIVE_PUBID}'
      
      # AI - OpenAI
      OPENAI_API_KEY: '${SERVICE_OPENAI_KEY}'
      
      # Stripe Payments
      FEE_AMOUNT: '${FEE_AMOUNT:-0.05}'
      STRIPE_PUBLISHABLE_KEY: '${STRIPE_PUBLISHABLE_KEY}'
      STRIPE_SECRET_KEY: '${STRIPE_SECRET_KEY}'
      STRIPE_SIGNING_KEY: '${STRIPE_SIGNING_KEY}'
      STRIPE_SIGNING_KEY_CONNECT: '${STRIPE_SIGNING_KEY_CONNECT}'
      
      # Misc
      NEXT_PUBLIC_DISCORD_SUPPORT: '${NEXT_PUBLIC_DISCORD_SUPPORT}'
      NEXT_PUBLIC_POLOTNO: '${NEXT_PUBLIC_POLOTNO}'
      IS_GENERAL: 'true'
      NX_ADD_PLUGINS: '${NX_ADD_PLUGINS:-false}'
      NOT_SECURED: '${NOT_SECURED:-false}'
      
    depends_on:
      temporal:
        condition: service_healthy
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    volumes:
      - 'postiz-config:/config/'
      - 'postiz-uploads:/uploads/'
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.postiz-api.rule=Host(`postiz.keith-antony.com`) && PathPrefix(`/api`)
      - traefik.http.routers.postiz-api.entryPoints=https
      - traefik.http.routers.postiz-api.tls=true
      - traefik.http.routers.postiz-api.tls.certresolver=letsencrypt
      - traefik.http.services.postiz-api.loadbalancer.server.port=3000
      - traefik.http.middlewares.postiz-api-stripprefix.stripprefix.prefixes=/api
      - traefik.http.routers.postiz-api.middlewares=postiz-api-stripprefix
    command:
      - pnpm
      - '--filter'
      - postiz-backend
      - start

  orchestrator:
    image: 'ghcr.io/gitroomhq/postiz-app:latest'
    container_name: postiz-orchestrator
    restart: always
    environment:
      # Database & Cache
      DATABASE_URL: 'postgresql://postiz-user:${SERVICE_PASSWORD_POSTGRESQL}@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'
      
      # Temporal
      TEMPORAL_ADDRESS: 'temporal:7233'
      
      # Social Media credentials (needed for workers)
      X_API_KEY: '${SERVICE_X_API}'
      X_API_SECRET: '${SERVICE_X_SECRET}'
      LINKEDIN_CLIENT_ID: '${SERVICE_LINKEDIN_ID}'
      LINKEDIN_CLIENT_SECRET: '${SERVICE_LINKEDIN_SECRET}'
      REDDIT_CLIENT_ID: '${SERVICE_REDDIT_API}'
      REDDIT_CLIENT_SECRET: '${SERVICE_REDDIT_SECRET}'
      GITHUB_CLIENT_ID: '${SERVICE_GITHUB_ID}'
      GITHUB_CLIENT_SECRET: '${SERVICE_GITHUB_SECRET}'
      THREADS_APP_ID: '${SERVICE_THREADS_ID}'
      THREADS_APP_SECRET: '${SERVICE_THREADS_SECRET}'
      FACEBOOK_APP_ID: '${SERVICE_FACEBOOK_ID}'
      FACEBOOK_APP_SECRET: '${SERVICE_FACEBOOK_SECRET}'
      YOUTUBE_CLIENT_ID: '${SERVICE_YOUTUBE_ID}'
      YOUTUBE_CLIENT_SECRET: '${SERVICE_YOUTUBE_SECRET}'
      TIKTOK_CLIENT_ID: '${SERVICE_TIKTOK_ID}'
      TIKTOK_CLIENT_SECRET: '${SERVICE_TIKTOK_SECRET}'
      PINTEREST_CLIENT_ID: '${SERVICE_PINTEREST_ID}'
      PINTEREST_CLIENT_SECRET: '${SERVICE_PINTEREST_SECRET}'
      DRIBBBLE_CLIENT_ID: '${SERVICE_DRIBBLE_ID}'
      DRIBBBLE_CLIENT_SECRET: '${SERVICE_DRIBBLE_SECRET}'
      DISCORD_CLIENT_ID: '${SERVICE_DISCORD_ID}'
      DISCORD_CLIENT_SECRET: '${SERVICE_DISCORD_SECRET}'
      DISCORD_BOT_TOKEN_ID: '${SERVICE_DISCORD_TOKEN}'
      SLACK_ID: '${SERVICE_SLACK_ID}'
      SLACK_SECRET: '${SERVICE_SLACK_SECRET}'
      SLACK_SIGNING_SECRET: '${SLACK_SIGNING_SECRET}'
      MASTODON_CLIENT_ID: '${SERVICE_MASTODON_ID}'
      MASTODON_CLIENT_SECRET: '${SERVICE_MASTODON_SECRET}'
      INSTAGRAM_APP_ID: '${INSTAGRAM_APP_ID}'
      INSTAGRAM_APP_SECRET: '${INSTAGRAM_APP_SECRET}'
      BEEHIIVE_API_KEY: '${SERVICE_BEEHIIVE_KEY}'
      BEEHIIVE_PUBLICATION_ID: '${SERVICE_BEEHIIVE_PUBID}'
      OPENAI_API_KEY: '${SERVICE_OPENAI_KEY}'
      
    networks:
      - coolify
    depends_on:
      temporal:
        condition: service_healthy
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    command:
      - pnpm
      - '--filter'
      - postiz-orchestrator
      - start

  postiz-postgres:
    image: 'postgres:17-alpine'
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: '${SERVICE_PASSWORD_POSTGRESQL}'
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - 'postgres-volume:/var/lib/postgresql/data'
    networks:
      - coolify
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U postiz-user -d postiz-db-local'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postiz-redis:
    image: 'redis:7.2'
    container_name: postiz-redis
    restart: always
    volumes:
      - 'postiz-redis-data:/data'
    networks:
      - coolify
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  temporal:
    image: 'temporalio/auto-setup:1.28.1'
    container_name: temporal
    restart: always
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    networks:
      - coolify
    healthcheck:
      test:
        - CMD
        - tctl
        - '--address'
        - 'temporal:7233'
        - cluster
        - health
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  temporal-postgresql:
    image: 'postgres:13-alpine'
    container_name: temporal-postgresql
    restart: always
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - 'temporal-postgres-data:/var/lib/postgresql/data'
    networks:
      - coolify
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U temporal -d temporal'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-elasticsearch:
    image: 'elasticsearch:7.17.10'
    container_name: temporal-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    volumes:
      - 'temporal-elasticsearch-data:/usr/share/elasticsearch/data'
    networks:
      - coolify
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -s http://localhost:9200/_cluster/health | grep -q ''"status":"green"\|"status":"yellow"'''
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postiz-config:
  postiz-uploads:
  postgres-volume:
  postiz-redis-data:
  temporal-postgres-data:
  temporal-elasticsearch-data:

networks:
  coolify:
    external: true
