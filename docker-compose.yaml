services:
  frontend:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz-frontend
    restart: always
    environment:
      MAIN_URL: "https://postiz.keith-antony.com"
      FRONTEND_URL: "https://postiz.keith-antony.com"
      NEXT_PUBLIC_BACKEND_URL: "https://postiz.keith-antony.com/api"
      JWT_SECRET: "klbnc0ncpmpclcohciag877bcoihcx0qu"

      DATABASE_URL: "postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"

      # IMPORTANT: point to backend service, not localhost
      BACKEND_INTERNAL_URL: "http://backend:3000"

      IS_GENERAL: "true"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postiz.rule=Host(`postiz.keith-antony.com`)"
      - "traefik.http.routers.postiz.entryPoints=https"
      - "traefik.http.routers.postiz.tls=true"
      - "traefik.http.routers.postiz.tls.certresolver=letsencrypt"
      # Frontend is listening on 4200 in your log
      - "traefik.http.services.postiz.loadbalancer.server.port=4200"
    depends_on:
      backend:
        condition: service_started
      orchestrator:
        condition: service_started
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  backend:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz-backend
    restart: always
    environment:
      MAIN_URL: "https://postiz.keith-antony.com"
      FRONTEND_URL: "https://postiz.keith-antony.com"
      NEXT_PUBLIC_BACKEND_URL: "https://postiz.keith-antony.com/api"
      JWT_SECRET: "klbnc0ncpmpclcohciag877bcoihcx0qu"

      DATABASE_URL: "postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"

      # IMPORTANT: point to temporal service, not localhost
      TEMPORAL_ADDRESS: "temporal:7233"

      IS_GENERAL: "true"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    depends_on:
      temporal:
        condition: service_started
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks:
      - coolify
    command: ["pnpm","--filter","postiz-backend","start"]

  orchestrator:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz-orchestrator
    restart: always
    environment:
      DATABASE_URL: "postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"

      # IMPORTANT: point to temporal service, not localhost
      TEMPORAL_ADDRESS: "temporal:7233"
    networks:
      - coolify
    depends_on:
      temporal:
        condition: service_started
    command: ["pnpm","--filter","postiz-orchestrator","start"]

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    volumes:
      - postiz-redis-data:/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: always
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_started
    networks:
      - coolify

  temporal-postgresql:
    image: postgres:13-alpine
    container_name: temporal-postgresql
    restart: always
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-elasticsearch:
    image: elasticsearch:7.17.10
    container_name: temporal-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - coolify

volumes:
  postiz-config:
  postiz-uploads:
  postgres-volume:
  postiz-redis-data:
  temporal-postgres-data:
  temporal-elasticsearch-data:

networks:
  coolify:
    external: true
