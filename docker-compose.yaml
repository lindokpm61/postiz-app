services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.12.1
    restart: always
    environment:
      MAIN_URL: "https://postiz.keith-antony.com"
      FRONTEND_URL: "https://postiz.keith-antony.com"
      NEXT_PUBLIC_BACKEND_URL: "https://postiz.keith-antony.com/api"
      JWT_SECRET: "kA9xPm2vLq8sNw4jRt6yBc3hFe7iDg0zXu5oMl1nVp"
      DATABASE_URL: "postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"

      TEMPORAL_ADDRESS: "temporal:7233"
      RUN_CRON: "true"
      IS_GENERAL: "true"

      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postiz.rule=Host(`postiz.keith-antony.com`)"
      - "traefik.http.routers.postiz.entryPoints=https"
      - "traefik.http.routers.postiz.tls=true"
      - "traefik.http.routers.postiz.tls.certresolver=letsencrypt"
      - "traefik.http.services.postiz.loadbalancer.server.port=5000"

  postiz-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 3s
      retries: 10

  postiz-redis:
    image: redis:7.2
    restart: always
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data
    expose:
      - "9200"

  temporal-postgresql:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - "5432"

  # ✅ NEW: init container to write dynamic config into a named volume
  temporal-dynamicconfig-init:
    image: alpine:3.20
    restart: "no"
    networks:
      - temporal-network
    volumes:
      - temporal-dynamicconfig:/etc/temporal/config/dynamicconfig
    command: >
      sh -lc '
        mkdir -p /etc/temporal/config/dynamicconfig &&
        cat > /etc/temporal/config/dynamicconfig/development-sql.yaml << "YAML"
        frontend.enableUpdateWorkflowExecution:
          - value: true
            constraints: {}
        YAML
        ;
        echo "Dynamic config written:";
        ls -la /etc/temporal/config/dynamicconfig;
      '

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: always
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_started
      # ✅ ensure file is created before temporal starts
      temporal-dynamicconfig-init:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    expose:
      - "7233"
    # ✅ mount dynamic config where Temporal expects it (config/dynamicconfig/...)
    volumes:
      - temporal-dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-admin-tools:
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: always
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    tty: true

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-pg-data:
  temporal-es-data:
  # ✅ NEW volume for dynamic config
  temporal-dynamicconfig:

networks:
  postiz-network:
    driver: bridge
  temporal-network:
    driver: bridge
